name: Validate Toolbox

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n: $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          jq empty config/containers.json
          jq empty config/plugins.json

      - name: Validate plugin catalog
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            type == "array" and
            length > 0 and
            ([.[].id] | length == (unique | length)) and
            all(.[];
              (.id | type == "string" and length > 0) and
              (.name | type == "string" and length > 0) and
              (.category | type == "string" and length > 0) and
              (.check | type == "string" and length > 0) and
              (.install_type == "package" or .install_type == "script")
            )
          ' config/plugins.json >/dev/null

      - name: ShellCheck errors
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          find . -type f -name '*.sh' -print0 | xargs -0 shellcheck -S error
